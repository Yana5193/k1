services:
  product-service:
    build: ./product_service
    ports:
      - "8001:8000"

  discount-service:
    build: ./discount_service
    ports:
      - "8003:8000"

  order-service:
    build: ./order_service
    ports:
      - "8002:8000"
    environment:
      - PRODUCT_SERVICE_URL=http://product-service:8000
      - DISCOUNT_SERVICE_URL=http://discount-service:8000
    depends_on:
      - product-service
      - discount-service